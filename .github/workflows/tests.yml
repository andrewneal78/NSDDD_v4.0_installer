name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Run tests
        run: python -m pytest -q tests

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the shell scripts
        run: |
          for f in "Install NSDDD.command" Launch.command "Update NSDDD.command" publish_public.sh; do
            bash -n "$f"
          done
          shellcheck "Install NSDDD.command" Launch.command "Update NSDDD.command"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Known vulnerabilities in the pinned packages
        # Several pins have advisories whose fixes need minor or major upgrades (see the audit); this job reports
        # them on every push without blocking until those upgrades are tested. Remove continue-on-error then.
        continue-on-error: true
        run: |
          pip-audit --disable-pip --no-deps -r constraints.txt
          pip-audit --disable-pip --no-deps -r constraints-intel-mac.txt
